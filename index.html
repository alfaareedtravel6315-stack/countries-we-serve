<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Countries We Serve</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <section class="countries-section">
    <div class="section-heading">
      <h1>Countries We Serve</h1>
      <p>Connecting Talent with Opportunities Across the Gulf Region and Beyond.</p>
    </div>

    <div class="carousel-window" aria-label="Countries We Serve">
      <div class="carousel-track" id="carouselTrack">
        <div class="carousel-set" id="carouselSet">
          <article class="country-card">
            <img src="1.saudi.png" alt="Saudi Arabia">
           
          </article>

          <article class="country-card">
            <img src="2.dubai.png" alt="Dubai (UAE)">
            
          </article>

          <article class="country-card">
            <img src="3.oman.png" alt="Oman">
           
          </article>

          <article class="country-card">
            <img src="4.qatar.png" alt="Qatar">
           
          </article>

          <article class="country-card">
            <img src="5.kuwait.png" alt="Kuwait">
           
          </article>

          <article class="country-card">
            <img src="6.bahrain.png" alt="Bahrain">
          
          </article>
        </div>
      </div>
    </div>
  </section>

  <script src="script.js"></script>
</body>
</html>
