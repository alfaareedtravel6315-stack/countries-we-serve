<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Countries We Serve</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- =========================================================
       COUNTRIES WE SERVE — MAIN EDITABLE BLOCK
       ========================================================= -->
  <section class="countries-section" aria-label="Countries We Serve">

    <!-- HEADING + SUBHEADING: EDIT THIS BLOCK ONLY -->
    <div class="countries-heading-block">
      <h2 class="countries-heading">Countries We Serve</h2>
      <p class="countries-subheading">
        Connecting Talent with Opportunities Across the Gulf Region and Beyond.
      </p>
    </div>

    <!-- COUNTRY SLIDER -->
    <div class="countries-slider" data-slider>
      <div class="countries-viewport">
        <div class="countries-track" data-track>

          <!-- FILE ORDER: 1 → 2 → 3 → 4 → 5 → 6 -->
          <div class="country-card"><img src="1.saudi.png" alt="Saudi Arabia"></div>
          <div class="country-card"><img src="2.dubai.png" alt="Dubai (UAE)"></div>
          <div class="country-card"><img src="3.oman.png" alt="Oman"></div>
          <div class="country-card"><img src="4.qatar.png" alt="Qatar"></div>
          <div class="country-card"><img src="5.kuwait.png" alt="Kuwait"></div>
          <div class="country-card"><img src="6.bahrain.png" alt="Bahrain"></div>

        </div>
      </div>
    </div>

  </section>

  <script src="script.js"></script>
</body>
</html>
